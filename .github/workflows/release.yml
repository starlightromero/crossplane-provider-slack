name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  GO_VERSION: "1.26"
  FAMILY_IMAGE: ghcr.io/starlightromero/provider-family-slack
  CONVERSATION_IMAGE: ghcr.io/starlightromero/provider-slack-conversation
  USERGROUP_IMAGE: ghcr.io/starlightromero/provider-slack-usergroup

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      new-release: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build and push combined images (controller + package.yaml) to GHCR
  # ---------------------------------------------------------------------------
  build-push:
    name: Build and Push (${{ matrix.name }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release == 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
        include_def:
          - name: family-slack
            image: ghcr.io/starlightromero/provider-family-slack
            dockerfile: Dockerfile.family
            package-root: package/family
          - name: conversation
            image: ghcr.io/starlightromero/provider-slack-conversation
            dockerfile: Dockerfile.conversation
            package-root: package/conversation
          - name: usergroup
            image: ghcr.io/starlightromero/provider-slack-usergroup
            dockerfile: Dockerfile.usergroup
            package-root: package/usergroup
        include:
          - arch: amd64
            include_def:
              name: family-slack
              image: ghcr.io/starlightromero/provider-family-slack
              dockerfile: Dockerfile.family
              package-root: package/family
          - arch: arm64
            include_def:
              name: family-slack
              image: ghcr.io/starlightromero/provider-family-slack
              dockerfile: Dockerfile.family
              package-root: package/family
          - arch: amd64
            include_def:
              name: conversation
              image: ghcr.io/starlightromero/provider-slack-conversation
              dockerfile: Dockerfile.conversation
              package-root: package/conversation
          - arch: arm64
            include_def:
              name: conversation
              image: ghcr.io/starlightromero/provider-slack-conversation
              dockerfile: Dockerfile.conversation
              package-root: package/conversation
          - arch: amd64
            include_def:
              name: usergroup
              image: ghcr.io/starlightromero/provider-slack-usergroup
              dockerfile: Dockerfile.usergroup
              package-root: package/usergroup
          - arch: arm64
            include_def:
              name: usergroup
              image: ghcr.io/starlightromero/provider-slack-usergroup
              dockerfile: Dockerfile.usergroup
              package-root: package/usergroup
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Substitute version into crossplane.yaml
        run: |
          sed -i "s/VERSION_PLACEHOLDER/v${{ needs.semantic-release.outputs.version }}/" \
            ${{ matrix.include_def.package-root }}/crossplane.yaml

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.include_def.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ matrix.include_def.image }}:v${{ needs.semantic-release.outputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Create multi-arch manifests
  # ---------------------------------------------------------------------------
  image-manifest:
    name: Image Manifests
    runs-on: ubuntu-latest
    needs: [semantic-release, build-push]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          VERSION="v${{ needs.semantic-release.outputs.version }}"

          for IMAGE in \
            "${{ env.FAMILY_IMAGE }}" \
            "${{ env.CONVERSATION_IMAGE }}" \
            "${{ env.USERGROUP_IMAGE }}"; do

            docker manifest create --amend \
              "${IMAGE}:${VERSION}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"

            docker manifest annotate \
              "${IMAGE}:${VERSION}" \
              "${IMAGE}:${VERSION}-amd64" \
              --os linux --arch amd64

            docker manifest annotate \
              "${IMAGE}:${VERSION}" \
              "${IMAGE}:${VERSION}-arm64" \
              --os linux --arch arm64

            docker manifest push "${IMAGE}:${VERSION}"
          done

  # ---------------------------------------------------------------------------
  # Attach artifacts to GitHub Release and generate SBOM
  # ---------------------------------------------------------------------------
  release-assets:
    name: Release Assets
    runs-on: ubuntu-latest
    needs: [semantic-release, image-manifest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.semantic-release.outputs.tag }} \
            sbom.cdx.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ needs.semantic-release.outputs.tag }} \
            --repo ${{ github.repository }} \
            --draft=false
