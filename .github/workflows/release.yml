name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  GO_VERSION: "1.26"
  FAMILY_IMAGE: ghcr.io/starlightromero/provider-family-slack
  CONVERSATION_IMAGE: ghcr.io/starlightromero/provider-slack-conversation
  USERGROUP_IMAGE: ghcr.io/starlightromero/provider-slack-usergroup

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      new-release: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build and push per-arch controller images to GHCR
  # ---------------------------------------------------------------------------
  build-push:
    name: Build and Push (${{ matrix.name }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release == 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
        include_def:
          - name: family-slack
            image: ghcr.io/starlightromero/provider-family-slack
            dockerfile: Dockerfile.family
          - name: conversation
            image: ghcr.io/starlightromero/provider-slack-conversation
            dockerfile: Dockerfile.conversation
          - name: usergroup
            image: ghcr.io/starlightromero/provider-slack-usergroup
            dockerfile: Dockerfile.usergroup
        include:
          - arch: amd64
            include_def:
              name: family-slack
              image: ghcr.io/starlightromero/provider-family-slack
              dockerfile: Dockerfile.family
          - arch: arm64
            include_def:
              name: family-slack
              image: ghcr.io/starlightromero/provider-family-slack
              dockerfile: Dockerfile.family
          - arch: amd64
            include_def:
              name: conversation
              image: ghcr.io/starlightromero/provider-slack-conversation
              dockerfile: Dockerfile.conversation
          - arch: arm64
            include_def:
              name: conversation
              image: ghcr.io/starlightromero/provider-slack-conversation
              dockerfile: Dockerfile.conversation
          - arch: amd64
            include_def:
              name: usergroup
              image: ghcr.io/starlightromero/provider-slack-usergroup
              dockerfile: Dockerfile.usergroup
          - arch: arm64
            include_def:
              name: usergroup
              image: ghcr.io/starlightromero/provider-slack-usergroup
              dockerfile: Dockerfile.usergroup
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.include_def.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ matrix.include_def.image }}:${{ needs.semantic-release.outputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Create multi-arch manifests for controller images
  # ---------------------------------------------------------------------------
  image-manifest:
    name: Controller Image Manifests
    runs-on: ubuntu-latest
    needs: [semantic-release, build-push]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push controller image manifests
        run: |
          VERSION="${{ needs.semantic-release.outputs.version }}"

          for IMAGE in \
            "${{ env.FAMILY_IMAGE }}" \
            "${{ env.CONVERSATION_IMAGE }}" \
            "${{ env.USERGROUP_IMAGE }}"; do

            docker manifest create \
              "${IMAGE}:${VERSION}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"

            docker manifest annotate \
              "${IMAGE}:${VERSION}" \
              "${IMAGE}:${VERSION}-amd64" \
              --os linux --arch amd64

            docker manifest annotate \
              "${IMAGE}:${VERSION}" \
              "${IMAGE}:${VERSION}-arm64" \
              --os linux --arch arm64

            docker manifest push "${IMAGE}:${VERSION}"
          done

  # ---------------------------------------------------------------------------
  # Build Crossplane xpkg per-arch with embedded runtime
  # ---------------------------------------------------------------------------
  package:
    name: Crossplane Package (${{ matrix.name }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [semantic-release, build-push]
    if: needs.semantic-release.outputs.new-release == 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
        name: [family-slack, slack-conversation, slack-usergroup]
        include:
          - name: family-slack
            image: ghcr.io/starlightromero/provider-family-slack
            package-root: package/family
          - name: slack-conversation
            image: ghcr.io/starlightromero/provider-slack-conversation
            package-root: package/conversation
          - name: slack-usergroup
            image: ghcr.io/starlightromero/provider-slack-usergroup
            package-root: package/usergroup
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/

      - name: Substitute version into crossplane.yaml
        run: |
          sed -i "s/VERSION_PLACEHOLDER/${{ needs.semantic-release.outputs.version }}/" \
            ${{ matrix.package-root }}/crossplane.yaml

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull arch-specific controller image
        run: |
          docker pull \
            ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}-${{ matrix.arch }}

      - name: Build Crossplane package with embedded runtime
        run: |
          crossplane xpkg build \
            --package-root=${{ matrix.package-root }} \
            --embed-runtime-image=${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}-${{ matrix.arch }} \
            -o provider-${{ matrix.name }}-${{ matrix.arch }}.xpkg

      - name: Push arch-specific xpkg
        run: |
          crossplane xpkg push \
            -f provider-${{ matrix.name }}-${{ matrix.arch }}.xpkg \
            ${{ matrix.image }}:v${{ needs.semantic-release.outputs.version }}-xpkg-${{ matrix.arch }}

      - name: Upload xpkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpkg-${{ matrix.name }}-${{ matrix.arch }}
          path: provider-${{ matrix.name }}-${{ matrix.arch }}.xpkg

  # ---------------------------------------------------------------------------
  # Create multi-arch manifest lists for each xpkg
  # ---------------------------------------------------------------------------
  package-manifest:
    name: Crossplane Package Manifests
    runs-on: ubuntu-latest
    needs: [semantic-release, package]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists
        run: |
          VERSION="v${{ needs.semantic-release.outputs.version }}"

          for IMAGE in \
            "${{ env.FAMILY_IMAGE }}" \
            "${{ env.CONVERSATION_IMAGE }}" \
            "${{ env.USERGROUP_IMAGE }}"; do

            docker manifest create \
              "${IMAGE}:${VERSION}-xpkg" \
              "${IMAGE}:${VERSION}-xpkg-amd64" \
              "${IMAGE}:${VERSION}-xpkg-arm64"

            docker manifest annotate \
              "${IMAGE}:${VERSION}-xpkg" \
              "${IMAGE}:${VERSION}-xpkg-amd64" \
              --os linux --arch amd64

            docker manifest annotate \
              "${IMAGE}:${VERSION}-xpkg" \
              "${IMAGE}:${VERSION}-xpkg-arm64" \
              --os linux --arch arm64

            docker manifest push "${IMAGE}:${VERSION}-xpkg"
          done

  # ---------------------------------------------------------------------------
  # Attach artifacts to GitHub Release and generate SBOM
  # ---------------------------------------------------------------------------
  release-assets:
    name: Release Assets
    runs-on: ubuntu-latest
    needs: [semantic-release, package-manifest, image-manifest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download xpkg artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: xpkg-*
          merge-multiple: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.semantic-release.outputs.tag }} \
            provider-family-slack-amd64.xpkg \
            provider-family-slack-arm64.xpkg \
            provider-slack-conversation-amd64.xpkg \
            provider-slack-conversation-arm64.xpkg \
            provider-slack-usergroup-amd64.xpkg \
            provider-slack-usergroup-arm64.xpkg \
            sbom.cdx.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ needs.semantic-release.outputs.tag }} \
            --repo ${{ github.repository }} \
            --draft=false
