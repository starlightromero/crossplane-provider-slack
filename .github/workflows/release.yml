name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  GO_VERSION: "1.26"
  FAMILY_IMAGE: ghcr.io/starlightromero/provider-family-slack
  CONVERSATION_IMAGE: ghcr.io/starlightromero/provider-slack-conversation
  USERGROUP_IMAGE: ghcr.io/starlightromero/provider-slack-usergroup

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      new-release: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release == 'true'
    strategy:
      matrix:
        include:
          - image: ghcr.io/starlightromero/provider-family-slack
            dockerfile: Dockerfile.family
          - image: ghcr.io/starlightromero/provider-slack-conversation
            dockerfile: Dockerfile.conversation
          - image: ghcr.io/starlightromero/provider-slack-usergroup
            dockerfile: Dockerfile.usergroup
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.semantic-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.semantic-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: Crossplane Package (${{ matrix.name }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [semantic-release, build-push]
    if: needs.semantic-release.outputs.new-release == 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            name: family-slack
            image: ghcr.io/starlightromero/provider-family-slack
            package-root: package/family
          - arch: amd64
            name: slack-conversation
            image: ghcr.io/starlightromero/provider-slack-conversation
            package-root: package/conversation
          - arch: amd64
            name: slack-usergroup
            image: ghcr.io/starlightromero/provider-slack-usergroup
            package-root: package/usergroup
          - arch: arm64
            name: family-slack
            image: ghcr.io/starlightromero/provider-family-slack
            package-root: package/family
          - arch: arm64
            name: slack-conversation
            image: ghcr.io/starlightromero/provider-slack-conversation
            package-root: package/conversation
          - arch: arm64
            name: slack-usergroup
            image: ghcr.io/starlightromero/provider-slack-usergroup
            package-root: package/usergroup
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/

      - name: Pull platform-specific runtime image
        run: |
          docker pull --platform linux/${{ matrix.arch }}             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}

      - name: Build Crossplane package
        run: |
          crossplane xpkg build             --package-root=${{ matrix.package-root }}             --embed-runtime-image=${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}             -o provider-${{ matrix.name }}-${{ matrix.arch }}.xpkg

      - name: Push arch-specific Crossplane package
        run: |
          crossplane xpkg push             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}-${{ matrix.arch }}             -f provider-${{ matrix.name }}-${{ matrix.arch }}.xpkg

      - name: Upload xpkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpkg-${{ matrix.name }}-${{ matrix.arch }}
          path: provider-${{ matrix.name }}-${{ matrix.arch }}.xpkg

  package-manifest:
    name: Package Manifest (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [semantic-release, package]
    strategy:
      matrix:
        include:
          - name: family-slack
            image: ghcr.io/starlightromero/provider-family-slack
          - name: slack-conversation
            image: ghcr.io/starlightromero/provider-slack-conversation
          - name: slack-usergroup
            image: ghcr.io/starlightromero/provider-slack-usergroup
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}             --amend ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}-amd64             --amend ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}-arm64

          docker manifest annotate             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}-amd64             --os linux --arch amd64

          docker manifest annotate             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}-arm64             --os linux --arch arm64

          docker manifest push             ${{ matrix.image }}:${{ needs.semantic-release.outputs.version }}

  release-assets:
    name: Release Assets
    runs-on: ubuntu-latest
    needs: [semantic-release, package-manifest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download xpkg artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: xpkg-*
          merge-multiple: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.semantic-release.outputs.tag }}             provider-family-slack-amd64.xpkg             provider-family-slack-arm64.xpkg             provider-slack-conversation-amd64.xpkg             provider-slack-conversation-arm64.xpkg             provider-slack-usergroup-amd64.xpkg             provider-slack-usergroup-arm64.xpkg             sbom.cdx.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ needs.semantic-release.outputs.tag }}             --repo ${{ github.repository }}             --draft=false
